# Drift's manager API is generated for every table by default and we never use
# it — Drift's `.watch()` streams plus the DAOs are the query surface.
# Leaving it on roughly triples the committed database.g.dart.
targets:
  $default:
    builders:
      drift_dev:
        options:
          generate_manager: false
          # For `drift_dev make-migrations`: one schema dump per version, the
          # stepByStep helper beside the database, and the migration tests.
          databases:
            app_database: lib/data/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
