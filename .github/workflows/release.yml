# A pushed v* tag builds every platform and attaches the files to a draft release.
# "Run workflow" builds the same files as run artifacts, without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The builds take their version name from pubspec, so a tag must agree with it.
      - name: Check tag matches pubspec version
        if: github.ref_type == 'tag'
        run: |
          pubspec="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "${GITHUB_REF_NAME#v}" != "$pubspec" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $pubspec in pubspec.yaml"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || fail "Secret ANDROID_$name is not set"
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks \
            || fail "Secret ANDROID_KEYSTORE_BASE64 is not valid base64"
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || fail "Keystore cannot be opened: wrong ANDROID_KEYSTORE_PASSWORD, or no key named ANDROID_KEY_ALIAS in it"
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-number="$GITHUB_RUN_NUMBER"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/paats_dranklijst-$GITHUB_REF_NAME-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v7
        with: { name: android, path: dist/* }

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build bundle
        run: |
          flutter build linux --release \
            --build-number="$GITHUB_RUN_NUMBER"
          mkdir dist
          tar czf "dist/paats_dranklijst-$GITHUB_REF_NAME-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: dist/* }

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # An unsigned .ipa is just the .app inside a Payload/ folder, zipped.
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign \
            --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/paats_dranklijst-$GITHUB_REF_NAME-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: dist/* }

  release:
    needs: [android, linux, ios]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes
