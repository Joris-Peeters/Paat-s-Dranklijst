name: paats_dranklijst
description: "A touchscreen fridge application that tracks consumption and finances for a youth movement."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  emoji_picker_flutter: ^4.5.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  # Only for InMemorySharedPreferencesAsync, the sanctioned test double for
  # SharedPreferencesWithCache.
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  # Required for gen-l10n. Without it, localization codegen silently produces nothing.
  generate: true
