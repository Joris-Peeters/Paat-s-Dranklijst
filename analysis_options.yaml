include: package:flutter_lints/flutter.yaml

analyzer:
  # No implicit dynamic anywhere
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated code, never hand-edited
    - lib/l10n/app_localizations*.dart
    # drift's own output. Its `ignore_for_file: type=lint` header silences the
    # linter but not analyzer warnings, and a view's generated `Query?` getter
    # trips strict-raw-types — a raw type we cannot spell differently.
    - lib/**.g.dart

linter:
  rules:
    # Imports
    - prefer_relative_imports
    - directives_ordering

    # Async — a dropped Future on a ledger write loses a transaction silently
    - unawaited_futures
    - cancel_subscriptions
    - avoid_dynamic_calls

    # Rebuild cost on low-end tablets
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Clarity
    - prefer_final_locals
    - prefer_final_in_for_each
    - always_declare_return_types
    - avoid_positional_boolean_parameters

    # Formatting
    - prefer_single_quotes
    - require_trailing_commas
